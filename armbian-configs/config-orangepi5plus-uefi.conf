# Orange Pi 5 Plus UEFI Build Configuration
# This configuration enables:
# - EDK2 UEFI (downloaded from edk2-porting/edk2-rk3588)
# - GRUB with DTB support (grub-with-dtb extension)
# - Mesa VPU with hardware acceleration for RK3588
# - GNOME desktop with Wayland support
# - Debian 14 (Forky)

# Board configuration
BOARD="orangepi5-plus"
BRANCH="vendor"
RELEASE="forky"

# Desktop configuration
BUILD_DESKTOP="yes"
DESKTOP_ENVIRONMENT="gnome"
DESKTOP_ENVIRONMENT_CONFIG_NAME="config_base"
DESKTOP_APPGROUPS_SELECTED=""

# Kernel configuration
KERNEL_CONFIGURE="no"

# Extensions - These are the key additions you asked for!
# uefi-edk2-rk3588: Enables EDK2 UEFI firmware, auto-enables grub-with-dtb
# mesa-vpu: Enables Mesa VPU hardware acceleration for RK3588
ENABLE_EXTENSIONS="uefi-edk2-rk3588,mesa-vpu"

# Image configuration
COMPRESS_OUTPUTIMAGE="sha,img,xz"
EXPERT="yes"

# GRUB configuration (used by grub-with-dtb extension)
# acpi=off is recommended for SBCs like Orange Pi 5 Plus
GRUB_CMDLINE_LINUX_DEFAULT="acpi=off"
UEFI_GRUB_TIMEOUT="5"

# Build options
BUILD_MINIMAL="no"
BSPFREEZE=""
